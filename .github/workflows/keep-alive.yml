name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render app
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://dealforage-application.onrender.com/"

